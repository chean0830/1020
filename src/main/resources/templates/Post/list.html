<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>게시글 목록</title>
	<link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
	<div class="container">
		<h1>게시글 목록</h1>

		<table>
			<thead>
				<tr>
					<th class="center" style="width: 80px;">번호</th>
					<th>제목</th>
					<th class="center" style="width: 120px;">작성자</th>
					<th class="center" style="width: 160px;">등록일</th>
				</tr>
			</thead>
			<tbody>
				<tr th:if="${#lists.isEmpty(postList)}">
					<td colspan="4" class="empty">등록된 게시글이 없습니다.</td>
				</tr>
				<tr th:each="post : ${postList}">
					<td class="center" th:text="${post.postNo}">1</td>
					<td>
						<!-- 제목 클릭 시 /Post/read?PostNo=글번호 로 이동 -->
						<a th:href="@{/Post/read(PostNo=${post.postNo})}" th:text="${post.title}">제목</a>
					</td>
					<td class="center" th:text="${post.writer}">작성자</td>
					<td class="center" th:text="${#temporals.format(post.regDate, 'yyyy-MM-dd HH:mm')}">2026-01-01</td>
				</tr>
			</tbody>
		</table>

		<!-- 페이징 : [처음] [이전] 1 2 3 4 5 [다음] [끝] -->
		<div class="paging" th:if="${page.totalCount > 0}">
			<a th:href="@{/Post/list(page=1)}">처음</a>
			<a th:if="${page.prev}" th:href="@{/Post/list(page=${page.startPage - 1})}">이전</a>
			<span th:unless="${page.prev}" class="disabled">이전</span>

			<th:block th:each="no : ${#numbers.sequence(page.startPage, page.endPage)}">
				<span th:if="${no == page.page}" class="current" th:text="${no}">1</span>
				<a th:unless="${no == page.page}" th:href="@{/Post/list(page=${no})}" th:text="${no}">2</a>
			</th:block>

			<a th:if="${page.next}" th:href="@{/Post/list(page=${page.endPage + 1})}">다음</a>
			<span th:unless="${page.next}" class="disabled">다음</span>
			<a th:href="@{/Post/list(page=${page.totalPages})}">끝</a>
		</div>
		<p class="meta" style="text-align:center; margin-top:8px;"
		   th:text="|전체 ${page.totalCount}건 · ${page.page} / ${page.totalPages} 페이지|">전체 0건</p>

		<div class="actions">
			<a class="btn btn-gray" th:href="@{/}">메인</a>
			<a class="btn btn-primary" th:href="@{/Post/insert}">글쓰기</a>
		</div>
	</div>
</body>
</html>
