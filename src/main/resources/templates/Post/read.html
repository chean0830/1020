<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>게시글 조회</title>
	<link rel="stylesheet" th:href="@{/css/board.css}">
</head>
<body>
	<div class="container">
		<h1 th:text="${post.title}">제목</h1>
		<div class="meta">
			<span th:text="|글번호 ${post.postNo}|">글번호</span> ·
			<span th:text="|작성자 ${post.writer}|">작성자</span> ·
			<span th:text="|등록일 ${#temporals.format(post.regDate, 'yyyy-MM-dd HH:mm')}|">등록일</span> ·
			<span th:text="|수정일 ${#temporals.format(post.updDate, 'yyyy-MM-dd HH:mm')}|">수정일</span>
		</div>

		<div class="content" th:text="${post.content}">내용</div>

		<div class="actions">
			<a class="btn btn-primary" th:href="@{/Post/update(PostNo=${post.postNo})}">수정</a>
			<a class="btn btn-gray" th:href="@{/Post/list}">목록</a>
		</div>
	</div>
</body>
</html>
